version: '3.8'

services:
  backend:
    build:
      context: ./heritage-shield-backend
      dockerfile: Dockerfile
    container_name: heritage-shield-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./heritage-shield-ui
      dockerfile: Dockerfile
    container_name: heritage-shield-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
